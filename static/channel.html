<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <link rel="stylesheet" href="/static/style.css">
  <title>{{.Title}}</title>
</head>
<body data-page="channel-receiver">
  <div class="workspace">
    {{template "app-header" .}}
    <main>
      <section id="channel-page" class="panel channel-receiver" data-channel-id="{{.ChannelID}}" data-visibility="{{.Visibility}}">
        <h1 data-i18n="channelReceiverTitle">加入临时信道</h1>
        <p class="hint" data-i18n="channelJoinDisclosure">加入后，你的登录身份或“匿名接收端”状态会实时显示给发送者，仅在信道存续期间可见；信道不留长期取件回执。</p>
        <div id="receiver-status" class="channel-state" role="status" aria-live="polite" data-i18n="channelStatusLoading">正在连接信道…</div>
        <ol id="channel-receive-stages" class="stage-rail" aria-label="接收阶段" hidden>
          <li data-stage="connecting" data-state="pending"><span class="stage-dot" aria-hidden="true"></span><span data-i18n="channelStageConnecting">连接</span></li>
          <li data-stage="downloading" data-state="pending"><span class="stage-dot" aria-hidden="true"></span><span data-i18n="channelStageReceiving">接收</span></li>
          <li data-stage="verifying" data-state="pending"><span class="stage-dot" aria-hidden="true"></span><span data-i18n="channelStageVerifying">校验</span></li>
          <li data-stage="ready" data-state="pending"><span class="stage-dot" aria-hidden="true"></span><span data-i18n="channelStageReady">可用</span></li>
        </ol>
        <section id="channel-browser-download" class="transfer-controls" hidden>
          <p id="channel-browser-download-status" class="hint" data-i18n="channelBrowserDownloadNote">大文件将交给浏览器下载；请保持此接收页打开，关闭或刷新会取消下载并释放席位。</p>
          <button id="channel-browser-download-button" class="button primary" type="button" disabled data-i18n="channelBrowserDownload">交给浏览器下载</button>
        </section>
        <section id="channel-receive-progress" class="transfer" hidden>
          <div class="transfer-head">
            <span id="channel-receive-phase" class="transfer-phase"></span>
            <strong id="channel-receive-percent" class="transfer-percent"></strong>
            <button id="channel-receive-retry" class="button quiet" type="button" hidden data-i18n="channelRetryReceive">继续接收</button>
          </div>
          <div id="channel-receive-track" class="transfer-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-labelledby="channel-receive-phase">
            <span id="channel-receive-fill"></span>
          </div>
          <div class="transfer-meta">
            <span id="channel-receive-bytes"></span>
            <span id="channel-receive-rate"></span>
          </div>
          <div class="transfer-context">
            <span id="channel-receive-attempt"></span>
            <span id="channel-receive-freshness"></span>
          </div>
          <p id="channel-receive-note" class="hint" hidden></p>
        </section>
        <section id="channel-received" class="receive-panel" hidden>
          <h2 data-i18n="channelReceivedTitle">已收到</h2>
          <div id="channel-download-archive" class="transfer-controls" hidden></div>
          <div id="channel-received-items" class="items"></div>
        </section>
        <div class="channel-actions">
          <button id="channel-join" class="button primary" type="button" data-i18n="channelJoin">加入并等待</button>
          <button id="channel-leave" class="button danger" type="button" hidden data-i18n="channelLeave">离开信道</button>
        </div>
        <p id="receiver-error" class="form-error" role="alert" hidden></p>
      </section>
    </main>
    {{template "app-footer" .}}
  </div>
  <script type="module" src="/static/script.js"></script>
  <script type="module" src="/static/channel-receiver.js?v={{.Version}}"></script>
</body>
</html>
