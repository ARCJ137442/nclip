<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>nclip</title>
    <link rel="stylesheet" href="/static/style.css?v={{.Version}}" />
  </head>
  <body data-page="compose">
    <div class="workspace">
      {{template "app-header" .}}
      <main>
        <section id="composer" class="panel composer">
          <div class="section-heading">
            <h1 data-i18n="compose">粘贴，然后分享</h1>
            <p data-i18n="composeHint">文字、截图和文件，一起生成一个链接。</p>
          </div>
          <fieldset id="draft-controls">
            <label class="sr-only" for="message" data-i18n="compose"
              >粘贴，然后分享</label
            ><textarea
              id="message"
              data-i18n-placeholder="placeholder"
              placeholder="在这里输入，或直接粘贴内容…"
              spellcheck="false"
            ></textarea>
            <div id="draft-items" class="items"></div>
            <p id="rich-hint" class="hint" data-i18n="richEdit" hidden></p>
            <p id="path-hint" class="hint" data-i18n="pathHint" hidden></p>
            <div class="compose-toolbar">
              <div class="input-actions">
                <button
                  type="button"
                  id="paste"
                  class="button secondary"
                  data-icon="clipboard"
                >
                  <span data-i18n="paste">粘贴</span></button
                ><button
                  type="button"
                  id="attach"
                  class="button secondary"
                  data-icon="attach"
                >
                  <span data-i18n="attach">添加文件</span></button
                ><input id="files" type="file" multiple hidden /><button
                  id="open-clipboard-receive"
                  class="button secondary"
                  type="button"
                  hidden
                ></button>
              </div>
              <span class="shortcut" data-i18n="shortcut"
                >Ctrl / ⌘ + Enter 发送</span
              >
            </div>
            <div class="send-row">
              <div class="sharing-options">
                <label class="check"
                  ><input id="burn" type="checkbox" /><span data-i18n="burn"
                    >一次性接收</span
                  ><span class="help-dot" tabindex="0" data-help="burnHint"
                    >ⓘ</span
                  ></label
                ><label class="check" id="public-option" hidden
                  ><input id="public-share" type="checkbox" /><span
                    data-i18n="publicShare"
                    >公网分享</span
                  ><span
                    class="help-dot"
                    tabindex="0"
                    data-help="publicShareHint"
                    >ⓘ</span
                  ></label
                >
              </div>
              <button
                id="send"
                type="button"
                class="button primary"
                data-icon="send"
              >
                <span data-i18n="send">生成链接</span>
              </button>
            </div>
          </fieldset>
          <div id="candidate" class="candidate" hidden>
            <div class="candidate-heading">
              <span data-icon="clipboard"></span
              ><strong data-i18n="candidate">剪贴板里有新内容</strong>
            </div>
            <div id="candidate-preview" class="items compact"></div>
            <button
              id="send-candidate"
              type="button"
              class="button secondary"
              data-i18n="sendCandidate"
            >
              发送并复制链接
            </button>
          </div>
          <p id="limits" class="hint"></p>
        </section>
        <section id="result" class="panel result" hidden tabindex="-1">
          <span class="result-check" data-icon="check"></span>
          <h1 data-i18n="sent">上传完成</h1>
          <p id="result-message"></p>
          <div class="link-row">
            <input
              id="share-url"
              type="url"
              readonly
              aria-label="Share URL"
            /><button id="copy-link" class="button primary" data-icon="copy">
              <span data-i18n="copyLink">复制链接</span>
            </button>
          </div>
          <div class="result-actions">
            <a id="open-share" class="button secondary" data-i18n="view"
              >打开接收页</a
            ><button
              id="native-share"
              class="button secondary"
              data-i18n="share"
              hidden
            >
              分享</button
            ><button
              id="new-share"
              class="button secondary"
              data-i18n="newShare"
            >
              再传一份
            </button>
          </div>
        </section>
        <div
          id="status"
          class="status"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></div>
        <details id="secondary-receive" class="secondary-receive" hidden>
          <summary data-i18n="receiveExisting">接收已有分享</summary>
          {{template "receive-entry" .}}
        </details>
        <details class="help">
          <summary data-i18n="help">命令行与使用帮助</summary>
          <p data-i18n="helpText"></p>
          <code
            >printf 'hello' | curl --user example-user --data-binary @-
            {{.Config.URL}}</code
          >
        </details>
      </main>
      {{template "app-footer" .}}
    </div>
    <div id="drop-overlay" hidden>
      <span data-icon="attach"></span
      ><span data-i18n="drop">放下文件，添加到待发送内容</span>
    </div>
    <script type="module" src="/static/script.js?v={{.Version}}"></script>
  </body>
</html>
