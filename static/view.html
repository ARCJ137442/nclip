<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>nclip</title>
    <link rel="stylesheet" href="/static/style.css?v={{.Version}}" />
  </head>
  <body data-page="receive" {{if .Paste}}data-slug="{{.Paste.ID}}" {{end}}>
    <div class="workspace">
      {{template "app-header" .}}
      <main>
        {{if .Paste}}
        <section class="panel receive-panel">
          <div class="section-heading">
            <h1 id="receive-title" data-i18n="contents">收到一份内容</h1>
            <p id="receive-subtitle"></p>
          </div>
          <ol id="receive-stages" class="stage-rail" aria-label="接收阶段">
            <li data-stage="connecting" data-state="pending">
              <span class="stage-dot" aria-hidden="true"></span
              ><span data-i18n="stageConnecting">连接</span>
            </li>
            <li data-stage="downloading" data-state="pending">
              <span class="stage-dot" aria-hidden="true"></span
              ><span data-i18n="stageReceiving">接收</span>
            </li>
            <li data-stage="verifying" data-state="pending">
              <span class="stage-dot" aria-hidden="true"></span
              ><span data-i18n="stageVerifying">校验</span>
            </li>
            <li data-stage="ready" data-state="pending">
              <span class="stage-dot" aria-hidden="true"></span
              ><span data-i18n="stageReady">可用</span>
            </li>
          </ol>
          <section id="receive-progress" class="transfer" hidden>
            <div class="transfer-head">
              <span id="receive-phase" class="transfer-phase"></span>
              <strong id="receive-percent" class="transfer-percent"></strong>
              <button
                id="receive-cancel"
                class="button quiet"
                type="button"
                data-i18n="cancelReceive"
              >
                取消接收
              </button>
            </div>
            <div
              id="receive-track"
              class="transfer-track"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              aria-labelledby="receive-phase"
            >
              <span id="receive-fill"></span>
            </div>
            <div class="transfer-meta">
              <span id="receive-bytes"></span>
              <span id="receive-rate"></span>
            </div>
            <div class="transfer-context">
              <span id="receive-attempt"></span>
              <span id="receive-freshness"></span>
            </div>
            <p id="receive-note" class="hint" hidden></p>
          </section>
          <p id="receive-resume" class="hint" hidden></p>
          <div id="receive-outcome" class="receive-outcome" hidden>
            <strong id="receive-outcome-title"></strong>
            <span id="receive-outcome-facts"></span>
          </div>
          <div id="receive-gate" hidden>
            <strong data-i18n="oneTimeTitle">这是一份一次性内容</strong>
            <p data-i18n="oneTimeHint"></p>
            <p class="hint" data-i18n="oneTimeNetwork"></p>
            <button id="receive" class="button primary" data-icon="clipboard">
              <span data-i18n="receive">接收并销毁</span>
            </button>
          </div>
          <div id="received-items" class="items"></div>
          <div id="receive-actions" class="result-actions">
            <button
              id="retry"
              class="button secondary"
              data-i18n="retry"
              hidden
            >
              重试加载</button
            ><a
              id="download-all"
              class="button secondary"
              href="/raw/{{.Paste.ID}}"
              download
              data-i18n="downloadAll"
              hidden
              >打包下载</a
            ><a
              href="/"
              class="button secondary"
              data-share-home
              data-i18n="backHome"
              >再传一份</a
            ><button
              id="delete-share"
              hidden
              class="button danger"
              data-i18n="delete"
            >
              删除分享
            </button>
          </div>
          <details id="metadata" class="metadata">
            <summary data-i18n="details">详细信息</summary>
            <dl id="metadata-values"></dl>
          </details>
        </section>
        {{if and .IsText (not .Paste.BurnAfterRead)}}<noscript
          ><section class="panel">
            <h2>
              {{if .IsPreview}}Content Preview (Truncated){{else}}Content{{end}}
            </h2>
            <pre>{{.Content}}</pre>
            <a href="/raw/{{.Paste.ID}}" download>Download</a>
          </section></noscript
        >{{end}} {{else}}
        <section class="panel empty-state">
          <span data-icon="file"></span>
          <h1 data-i18n="notFound">内容不存在或已失效</h1>
          <p data-i18n="notFoundHint"></p>
          <a
            href="/"
            class="button primary"
            data-share-home
            data-i18n="backHome"
            >再传一份</a
          >
        </section>
        {{end}}
        <div
          id="status"
          class="status"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></div>
      </main>
      {{template "app-footer" .}}
    </div>
    <script type="module" src="/static/script.js?v={{.Version}}"></script>
  </body>
</html>
