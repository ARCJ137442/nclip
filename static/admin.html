<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>管理 · nclip</title>
    <link rel="stylesheet" href="/static/style.css?v={{.Version}}" />
  </head>
  <body data-page="admin">
    <div class="workspace admin-workspace">
      {{template "app-header" .}}
      <main>
        <div class="section-heading admin-heading">
          <div>
            <span class="eyebrow">nclip</span>
            <h1 data-i18n="administration">管理</h1>
          </div>
          <button id="new-user" class="button primary" data-icon="add">
            <span data-i18n="createUser">创建用户</span>
          </button>
        </div>
        <div class="admin-tabs" role="tablist" aria-label="Administration">
          <button
            id="users-tab"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="users-panel"
            data-i18n="users"
          >
            用户</button
          ><button
            id="shares-tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="shares-panel"
            data-i18n="allShares"
          >
            分享内容</button
          ><button
            id="settings-tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="settings-panel"
            data-i18n="systemSettings"
          >
            系统设置
          </button>
        </div>
        <section
          id="users-panel"
          class="panel"
          role="tabpanel"
          aria-labelledby="users-tab"
        >
          <div class="list-toolbar">
            <label class="search-field"
              ><span class="sr-only" data-i18n="searchUsers">搜索用户</span
              ><input
                id="user-search"
                type="search"
                data-i18n-placeholder="searchUsers"
                placeholder="搜索用户"
                autocomplete="off" /></label
            ><span id="user-count" class="hint"></span>
          </div>
          <div id="user-list" class="admin-list"></div>
        </section>
        <section
          id="shares-panel"
          class="panel"
          role="tabpanel"
          aria-labelledby="shares-tab"
          hidden
        >
          <form id="share-search-form" class="list-toolbar">
            <label class="search-field"
              ><span class="sr-only" data-i18n="searchShares"
                >分享码、文件名或类型</span
              ><input
                id="share-search"
                type="search"
                data-i18n-placeholder="searchShares"
                autocomplete="off" /></label
            ><button class="button secondary" type="submit" data-i18n="search">
              搜索</button
            ><span id="share-count" class="hint"></span>
          </form>
          <div id="share-list" class="admin-list"></div>
          <div class="pagination">
            <button
              id="previous-page"
              class="button secondary"
              data-i18n="previous"
            >
              上一页</button
            ><span id="page-number"></span
            ><button id="next-page" class="button secondary" data-i18n="next">
              下一页
            </button>
          </div>
        </section>
        <section
          id="settings-panel"
          class="panel upload-settings-panel"
          role="tabpanel"
          aria-labelledby="settings-tab"
          hidden
        >
          <div class="settings-intro">
            <h2 data-i18n="uploadSettingsTitle">上传限额</h2>
            <p class="hint" data-i18n="uploadSettingsHint">
              设置浏览器分享功能每次可包含的内容总量。
            </p>
          </div>
          <form id="upload-settings-form">
            <label class="field" for="upload-limit-number">
              <span data-i18n="uploadLimitLabel">单次分享总量上限（MiB）</span>
              <input
                id="upload-limit-number"
                type="number"
                min="1"
                max="100"
                step="1"
                required
                inputmode="numeric"
                aria-describedby="upload-limit-range upload-limit-hint"
              />
            </label>
            <label class="upload-range-label" for="upload-limit-range">
              <span data-i18n="uploadLimitRange">快速调整</span>
              <input id="upload-limit-range" type="range" min="1" max="100" step="1" />
            </label>
            <div class="limit-presets" aria-label="Common upload limits">
              <button class="button secondary" type="button" data-upload-limit="5">5 MiB</button>
              <button class="button secondary" type="button" data-upload-limit="20">20 MiB</button>
              <button class="button secondary" type="button" data-upload-limit="50">50 MiB</button>
              <button class="button secondary" type="button" data-upload-limit="100">100 MiB</button>
            </div>
            <p id="upload-limit-hint" class="hint" data-i18n="uploadLimitCeiling">
              全局设置最高可设为 100 MiB；所有上传仍受 NCLIP_BUFFER_SIZE 限制。
            </p>
            <div class="settings-actions">
              <span id="upload-settings-state" class="hint" role="status" aria-live="polite"></span>
              <button id="reload-upload-settings" class="button secondary" type="button" data-i18n="reloadSettings" hidden>
                重新加载
              </button>
              <button id="save-upload-settings" class="button primary" type="submit" data-i18n="saveSettings">
                保存设置
              </button>
            </div>
            <p id="upload-settings-error" class="form-error" role="alert"></p>
          </form>
        </section>
        <div
          id="status"
          class="status"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></div>
      </main>
      {{template "app-footer" .}}
    </div>
    <dialog
      id="user-dialog"
      class="editor-dialog"
      aria-labelledby="user-dialog-title"
    >
      <form id="user-form" autocomplete="off">
        <div class="dialog-heading">
          <h2 id="user-dialog-title" data-i18n="createUser">创建用户</h2>
          <button
            id="close-user-dialog"
            type="button"
            class="button secondary"
            data-i18n="cancel"
          >
            取消
          </button>
        </div>
        <label class="field"
          ><span data-i18n="username">用户名</span
          ><input
            id="edit-username"
            name="new_username"
            type="text"
            required
            minlength="3"
            maxlength="64"
            autocapitalize="none"
            spellcheck="false"
            autocomplete="off"
        /></label>
        <label class="field"
          ><span data-i18n="newPassword">新密码</span
          ><input
            id="edit-password"
            name="new_password"
            type="password"
            autocomplete="new-password"
            maxlength="72"
          /><small id="password-hint" class="hint" data-i18n="newPasswordHint"
            >至少 8 字节；修改用户时留空则保持原密码。</small
          ></label
        >
        <label class="field" for="user-upload-limit">
          <span data-i18n="userUploadLimitLabel">单次上传内容上限（MiB）</span>
          <input
            id="user-upload-limit"
            type="number"
            min="1"
            max="100"
            step="1"
            value="100"
            inputmode="decimal"
            aria-describedby="user-upload-limit-hint"
          />
          <small id="user-upload-limit-hint" class="hint" data-i18n="userUploadLimitHint">
            普通默认值为 100 MiB；实际生效额度还受服务端 NCLIP_BUFFER_SIZE 限制。
          </small>
        </label>
        <label class="check user-upload-limit-option">
          <input id="no-user-upload-limit" type="checkbox" />
          <span data-i18n="noPerUserUploadLimit">不设置用户上限</span>
        </label>
        <fieldset id="user-permissions" class="permissions">
          <legend data-i18n="permissions">权限</legend>
          <label class="check"
            ><input id="permission-upload" type="checkbox" /><span
              data-i18n="permissionUpload"
              >上传</span
            ></label
          ><label class="check"
            ><input id="permission-download" type="checkbox" /><span
              data-i18n="permissionDownload"
              >下载</span
            ></label
          ><label class="check" id="manage-permission-option"
            ><input id="permission-manage" type="checkbox" /><span
              data-i18n="permissionManage"
              >管理</span
            ></label
          >
          <p class="hint" data-i18n="managePermissionHint">
            管理用户及全部分享；上传和下载分别授权。
          </p>
        </fieldset>
        <label class="check"
          ><input id="edit-disabled" type="checkbox" /><span
            data-i18n="disabledAccount"
            >停用账号</span
          ></label
        >
        <p id="manager-immutable-hint" class="hint" data-i18n="managerImmutableHint" hidden>
          管理员账号的用户名、权限、状态和上传上限固定；仍可重置密码。
        </p>
        <p id="user-form-error" class="form-error" role="alert"></p>
        <div class="dialog-actions">
          <button
            id="save-user"
            class="button primary"
            type="submit"
            data-i18n="save"
          >
            保存
          </button>
        </div>
      </form>
    </dialog>
    <dialog
      id="confirm-dialog"
      class="editor-dialog"
      aria-labelledby="confirm-title"
    >
      <h2 id="confirm-title" data-i18n="confirmDelete">确认删除</h2>
      <p id="confirm-description"></p>
      <p id="confirm-error" class="form-error" role="alert"></p>
      <div class="dialog-actions">
        <button id="confirm-cancel" class="button secondary" data-i18n="cancel">
          取消</button
        ><button
          id="confirm-delete"
          class="button danger"
          data-i18n="deleteAction"
        >
          删除
        </button>
      </div>
    </dialog>
    <script type="module" src="/static/script.js?v={{.Version}}"></script>
  </body>
</html>
