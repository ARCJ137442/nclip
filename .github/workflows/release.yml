name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate version
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-public-docs.mjs
      - name: Protect published assets from replacement
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag: process.env.RELEASE_TAG
              });
              if (!release.data.draft) throw new Error('Published releases are immutable; use a new version.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build self-contained binary package
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          SOURCE_SHA: ${{ needs.verify.outputs.source }}
        run: |
          set -euo pipefail
          package="nclip_linux_$GOARCH"
          mkdir -p "package/$package" out
          go build -trimpath -ldflags="-s -w -X main.Version=$RELEASE_TAG -X main.BuildTime=$(date -u +%FT%TZ) -X main.CommitHash=$SOURCE_SHA" -o "package/$package/nclip" .
          cp -R static "package/$package/static"
          tar -czf "out/$package.tar.gz" -C package "$package"
      - uses: actions/upload-artifact@v4
        with:
          name: release-binary-${{ matrix.arch }}
          path: out/*.tar.gz
          retention-days: 7

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source }}
      - name: Export versioned Linux amd64 image
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source }}
        run: |
          set -euo pipefail
          mkdir out
          docker build --platform linux/amd64 --build-arg VERSION="$RELEASE_TAG" --build-arg GIT_COMMIT="$SOURCE_SHA" --build-arg BUILD_TIME="$(date -u +%FT%TZ)" -t "nclip:$RELEASE_TAG" .
          docker save "nclip:$RELEASE_TAG" | gzip -n > out/nclip_image_linux_amd64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-image
          path: out/nclip_image_linux_amd64.tar.gz
          retention-days: 7

  draft:
    needs: [verify, binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Check tag and create checksums
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$SOURCE_SHA"
          printf 'version=%s\nsource=%s\n' "$RELEASE_TAG" "$SOURCE_SHA" > artifacts/BUILD-INFO.txt
          cd artifacts
          sha256sum nclip_linux_amd64.tar.gz nclip_linux_arm64.tar.gz nclip_image_linux_amd64.tar.gz BUILD-INFO.txt > SHA256SUMS
      - name: Prepare reviewable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: nclip ${{ env.RELEASE_TAG }} (ARC fork)
          body_path: Documents/RELEASE-NOTES.md
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/nclip_linux_amd64.tar.gz
            artifacts/nclip_linux_arm64.tar.gz
            artifacts/nclip_image_linux_amd64.tar.gz
            artifacts/BUILD-INFO.txt
            artifacts/SHA256SUMS
