---                        
apiVersion: v1           
kind: PersistentVolumeClaim
metadata:                                
  name: nclip-pvc
  namespace: nclip
  labels:                  
    app: nclip
spec:                                       
  accessModes:                    
    - ReadWriteOnce
  resources:                              
    requests:                 
      storage: 2Gi
