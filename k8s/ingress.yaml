apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nclip
  namespace: nclip
spec:
  rules:
  - host: clipboard.example.com
    http:
      paths:
      - backend:
          service:
            name: nclip
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - clipboard.example.com
